#cloud-config
# Converged agent base (Castor/Keel) with Cloudflare Tunnel transport.
# Placeholders (double-underscore tokens) are injected by vm.bicep at deploy
# time. The tunnel token is the ONLY secret in customData and is scrubbed from
# cloud logs after cloudflared installs. Runtime secrets (model/vision API keys)
# are fetched at first boot from the agent's Key Vault via managed identity
# (seeded by `fleetctl set-secrets`) — never in this file, never over SSH.
package_update: true
# docker-buildx is not optional dressing: without the plugin, `docker build` silently falls
# back to the LEGACY builder, which engine 29 has long deprecated. Installed here so a new VM
# never builds on a different builder than the fleet, and build-image.sh can ASSERT one
# rather than accept whichever happens to be present.
packages: [docker.io, docker-buildx, docker-compose-v2, git, python3-qrcode, curl]
runcmd:
  - set -e
  # --- Cloudflare Tunnel (outbound-only; no inbound ports required) ---
  - install -m 0755 -d /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main' > /etc/apt/sources.list.d/cloudflared.list
  - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y cloudflared
  - cloudflared service install '__CF_TUNNEL_TOKEN__'
  - grep -rl 'eyJ' /var/lib/cloud/ 2>/dev/null | xargs -r sed -i 's/eyJ[A-Za-z0-9._-]\{16,\}/CF-TOKEN-SCRUBBED/g'
  # --- Container runtime + agent image (hash-pinned build, per repo) ---
  - systemctl enable --now docker
  - usermod -aG docker __ADMIN_USER__
  - git clone '__REPO_URL__' /home/__ADMIN_USER__/agent
  - 'if [ -n "__REPO_REF__" ]; then git -C /home/__ADMIN_USER__/agent checkout --quiet "__REPO_REF__" || { echo "ABORT: repoRef __REPO_REF__ did not resolve" | tee /var/log/agent-image-build.log; exit 1; }; fi'
  - 'git -C /home/__ADMIN_USER__/agent rev-parse HEAD | tee /var/log/agent-built-sha.log'
  # Committer identity is a property of the CHECKOUT, set at birth. Without it, any commit made
  # on this VM -- a repair, a seed, anything future -- stamps a hostname fallback or fails
  # outright in a run-command shell that has no HOME. Repo-local (not --global, not --system),
  # so it lives in .git/config, survives every rebuild, and never depends on who is running git.
  # The NAME carries the machine identity; the email is the fleet's one REAL address for every
  # machine, because per-machine addresses would not exist and git refuses an empty one.
  - git -C /home/__ADMIN_USER__/agent config user.name '__AGENT_NAME__'
  - git -C /home/__ADMIN_USER__/agent config user.email 'keel@keel-pm.com'
  # Agent root: keel-style repos put infra/ at the clone root; Castor keeps it under
  # scaffold/. Detect and use the right dir (safe no-op for keel — no scaffold/).
  - 'if [ -d "/home/__ADMIN_USER__/agent/scaffold" ]; then AGENT_DIR="/home/__ADMIN_USER__/agent/scaffold"; else AGENT_DIR="/home/__ADMIN_USER__/agent"; fi; echo "agent dir: $AGENT_DIR"'
  - printf 'AGENT_PROFILE=%s\nKEY_VAULT_NAME=%s\nMSI_CLIENT_ID=%s\nAGENT_NAME=%s\nBACKUP_ACCOUNT=%s\n' '__AGENT_PROFILE__' '__KEY_VAULT_NAME__' '__MSI_CLIENT_ID__' '__AGENT_NAME__' '__BACKUP_ACCOUNT__' > "$AGENT_DIR/.provision-flags"
  # Brand this agent with its deploy-time name -- as an UNTRACKED overlay, system/agent.local.yaml
  # (gitignored in every agent repo, copied into the image with system/). Every reader of the name
  # (webchat brand, conversational identity: fleet-core auth.readAgentName) takes the overlay first
  # and the tracked agent.yaml's profile default second. It used to be a sed on the tracked file,
  # which left every provisioned checkout permanently dirty and made a git pull that touched
  # agent.yaml conflict -- the self-heal's fast-forward and any rebuild pull could not land such
  # a change. Verify loudly (fail the build rather than ship a mis-branded agent).
  - 'printf "# fleet overlay -- WRITTEN BY CLOUD-INIT AT PROVISION, DO NOT EDIT BY HAND.\n# This file is untracked and gitignored; it carries the deploy-time name only. The tracked\n# system/agent.yaml keeps the profile default and profile_name, and every reader takes this\n# file first (fleet-core auth.readAgentName). To change how the agent SPEAKS about itself at\n# runtime, edit state/persona.txt or use the Persona tab in the panel -- not this file, which is\n# rewritten on the next provision.\nagent_name: \"__AGENT_NAME__\"\n" > "$AGENT_DIR/system/agent.local.yaml"'
  - 'grep -qx "agent_name: \"__AGENT_NAME__\"" "$AGENT_DIR/system/agent.local.yaml" || { echo "ABORT: agent_name overlay not written for __AGENT_NAME__" | tee -a /var/log/agent-image-build.log; exit 1; }'
  # chown BEFORE the build so the tree is admin-owned even if the build fails, and
  # invoke the builder via bash so a missing +x bit on build-image.sh cannot
  # Permission-deny and abort the whole runcmd (set -e). build-image.sh writes no
  # repo files (docker build only), so chown-before is complete.
  - chown -R __ADMIN_USER__:__ADMIN_USER__ /home/__ADMIN_USER__/agent
  # build-image.sh tags the image from `git rev-parse` and runs here as root, but the
  # tree is now admin-owned — git's ownership-safety check would refuse and fail the
  # unattended build (works by hand only because the operator IS the admin user).
  # Grant root an exception for this one repo so cloud-init builds without a human.
  # MUST be --system (/etc/gitconfig): cloud-final.service runs with NO $HOME, and
  # `git config --global` dies there with `fatal: $HOME not set` — under set -e that
  # aborted the whole runcmd on example-04 (build + bootstrap never ran -> 502).
  - git config --system --add safe.directory /home/__ADMIN_USER__/agent
  # --- Self-heal FIRST, before anything that can fail. A timer re-runs bootstrap every 3 minutes
  # until the webchat container is healthy, then disables itself (loud give-up after ~2h). It used
  # to be installed after the build and the first bootstrap; a build that failed aborted runcmd
  # under set -e and the timer was never written -- the VM sat at 502 with an empty bootstrap log
  # and nothing to say. Now it exists before the first thing that can go wrong, defers while first
  # boot is still running (marker /run/agent-firstboot), fast-forwards a branch checkout, rebuilds a
  # missing image and re-runs bootstrap. Base64 like the backup wrapper: no shell quoting to break. ---
  - touch /run/agent-firstboot
  - 'echo  | base64 -d > /usr/local/bin/agent-bootstrap-retry && chmod 0755 /usr/local/bin/agent-bootstrap-retry'
  - 'printf "[Unit]\nDescription=Re-run agent bootstrap until the webchat is healthy\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/agent-bootstrap-retry\n" > /etc/systemd/system/agent-bootstrap-retry.service'
  - 'printf "[Unit]\nDescription=Agent bootstrap retry\n\n[Timer]\nOnBootSec=3min\nOnUnitActiveSec=3min\n\n[Install]\nWantedBy=timers.target\n" > /etc/systemd/system/agent-bootstrap-retry.timer'
  - 'systemctl daemon-reload && systemctl enable --now agent-bootstrap-retry.timer || echo "bootstrap retry timer enable failed (non-fatal)"'
  # The build and the first bootstrap are GUARDED: a failure is logged and runcmd continues (the
  # backup and intake timers still install), and the retry timer takes it from there. The marker
  # is removed when first boot is over so the timer knows the field is clear.
  - 'cd "$AGENT_DIR" && timeout 45m bash ./infra/scripts/build-image.sh > /var/log/agent-image-build.log 2>&1 || echo "image build FAILED or timed out -- the retry timer rebuilds it every 3 min (see /var/log/agent-image-build.log)" | tee -a /var/log/agent-image-build.log'
  # Self-bootstrap unattended: run bootstrap.sh as the admin user (the tree owner; it
  # uses sudo-docker). No TTY here, so it never prompts — it fetches secrets from the
  # vault and, if they aren't seeded yet, WAITS loudly on the serial console (up to
  # ~10 min) for `fleetctl set-secrets`, then aborts naming the missing secret. This is
  # what makes provisioning fire-and-forget: up --go + set-secrets and the agent comes
  # up on its own. If it aborts, the retry timer installed above re-runs it -- no SSH.
  - 'sudo -u __ADMIN_USER__ bash "$AGENT_DIR/infra/scripts/bootstrap.sh" > /var/log/agent-bootstrap.log 2>&1 || echo "bootstrap did not complete unattended -- the retry timer re-runs it every 3 min (see /var/log/agent-bootstrap.log)" | tee -a /var/log/agent-bootstrap.log'
  - rm -f /run/agent-firstboot
  # --- Fleet backup: wrapper + daily timer (script no-ops when BACKUP_ACCOUNT is empty) ---
  # Wrapper is base64-decoded (self-detecting agent root) -- no shell-quoting to break.
  - 'echo IyEvYmluL2Jhc2gKQUQ9L2hvbWUvYWdlbnRhZG1pbi9hZ2VudApbIC1kICIkQUQvc2NhZmZvbGQiIF0gJiYgQUQ9IiRBRC9zY2FmZm9sZCIKZXhlYyBiYXNoICIkQUQvc2NyaXB0cy9iYWNrdXAtcHVzaC5zaCIgIiRAIgo= | base64 -d > /usr/local/bin/agent-backup && chmod 0755 /usr/local/bin/agent-backup'
  - 'printf "[Unit]\nDescription=Fleet agent backup push\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/agent-backup push\n" > /etc/systemd/system/agent-backup.service'
  - 'printf "[Unit]\nDescription=Daily fleet agent backup\n\n[Timer]\nOnCalendar=daily\nRandomizedDelaySec=1800\nPersistent=true\n\n[Install]\nWantedBy=timers.target\n" > /etc/systemd/system/agent-backup.timer'
  - 'systemctl daemon-reload && systemctl enable --now agent-backup.timer || echo "backup timer enable failed (non-fatal)"'
  # --- Weekly PII scan: runs the profile scanner over the app tree and writes the log the
  # compliance board reads (stale past 8 days). Guard is -f, same reason as the sweep: vendored
  # scripts land 100644. Persistent=true so a missed Sunday runs at next boot rather than never.
  - 'echo IyEvYmluL2Jhc2gKQUQ9L2hvbWUvYWdlbnRhZG1pbi9hZ2VudApbIC1kICIkQUQvc2NhZmZvbGQiIF0gJiYgQUQ9IiRBRC9zY2FmZm9sZCIKWyAtZiAiJEFEL3NjcmlwdHMvcGlpLXNjYW4uc2giIF0gfHwgZXhpdCAwCmV4ZWMgYmFzaCAiJEFEL3NjcmlwdHMvcGlpLXNjYW4uc2giICIkQCIK | base64 -d > /usr/local/bin/agent-pii-scan && chmod 0755 /usr/local/bin/agent-pii-scan'
  - 'printf "[Unit]\nDescription=Fleet agent weekly PII scan\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/agent-pii-scan\n" > /etc/systemd/system/agent-pii-scan.service'
  - 'printf "[Unit]\nDescription=Fleet agent weekly PII scan timer\n\n[Timer]\nOnCalendar=Sun *-*-* 03:20:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target\n" > /etc/systemd/system/agent-pii-scan.timer'
  - 'systemctl daemon-reload && systemctl enable --now agent-pii-scan.timer || echo "pii-scan timer enable failed (non-fatal)"'
  # --- Intake sweep: pulls operator drops from this agent's own container into staging, every
  # 5 min. STAGES ONLY -- Process is still the operator's decision. No-ops on an agent whose
  # profile has not vendored the script yet, and on a fleet with no backup store.
  # The guard is -f, NOT -x: vendored scripts are committed from a Windows workstation and land
  # 100644 in the agent repos (backup-push.sh is 644 today), so an -x test would be false on every
  # agent and the sweep would silently never run. bash <file> does not need the exec bit.
  - 'echo IyEvYmluL2Jhc2gKQUQ9L2hvbWUvYWdlbnRhZG1pbi9hZ2VudApbIC1kICIkQUQvc2NhZmZvbGQiIF0gJiYgQUQ9IiRBRC9zY2FmZm9sZCIKWyAtZiAiJEFEL3NjcmlwdHMvaW50YWtlLXN3ZWVwLnNoIiBdIHx8IGV4aXQgMApleGVjIGJhc2ggIiRBRC9zY3JpcHRzL2ludGFrZS1zd2VlcC5zaCIgIiRAIgo= | base64 -d > /usr/local/bin/agent-intake-sweep && chmod 0755 /usr/local/bin/agent-intake-sweep'
  - 'printf "[Unit]\nDescription=Fleet agent intake sweep from the store\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/agent-intake-sweep\n" > /etc/systemd/system/agent-intake-sweep.service'
  - 'printf "[Unit]\nDescription=Fleet agent intake sweep timer\n\n[Timer]\nOnBootSec=2min\nOnUnitActiveSec=5min\n\n[Install]\nWantedBy=timers.target\n" > /etc/systemd/system/agent-intake-sweep.timer'
  - 'systemctl daemon-reload && systemctl enable --now agent-intake-sweep.timer || echo "intake sweep timer enable failed (non-fatal)"'
  # --- Fleet intake: wrapper + 2-min timer (no-ops on profiles without scripts/intake.js) ---
  # Same self-detecting base64 pattern as the backup wrapper -- no shell-quoting to break.
  - 'echo  | base64 -d > /usr/local/bin/agent-intake && chmod 0755 /usr/local/bin/agent-intake'
  - 'printf "[Unit]\nDescription=Fleet agent intake sweep\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/agent-intake\n" > /etc/systemd/system/agent-intake.service'
  - 'printf "[Unit]\nDescription=Fleet agent intake timer\n\n[Timer]\nOnBootSec=90\nOnUnitActiveSec=120\n\n[Install]\nWantedBy=timers.target\n" > /etc/systemd/system/agent-intake.timer'
  - 'systemctl daemon-reload && systemctl enable --now agent-intake.timer || echo "intake timer enable failed (non-fatal)"'
  - "{ dpkg-query -W docker.io docker-buildx docker-compose-v2 git cloudflared; } > /var/log/agent-provision-versions.log 2>&1"
final_message: "agent (__AGENT_PROFILE__) cloud-init complete after $UPTIME s -- it self-bootstraps from its Key Vault; seed with 'fleetctl set-secrets <agent>' if you haven't. Logs: /var/log/agent-bootstrap.log"
